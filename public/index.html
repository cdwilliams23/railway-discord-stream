<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discord Stream</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; background: #101827; color: #eef4ff; }
      main { max-width: 880px; margin: 0 auto; padding: 48px 20px; }
      header { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; border-bottom: 1px solid #2a3a52; padding-bottom: 18px; }
      h1 { margin: 0; font-size: 28px; }
      .status { color: #93e4b1; font-size: 14px; }
      #messages { display: grid; gap: 12px; margin-top: 24px; }
      article { background: #172338; border: 1px solid #2a3a52; border-radius: 10px; padding: 16px; }
      article strong { color: #9fc5ff; }
      article time { color: #8da0ba; font-size: 12px; float: right; }
      article p { white-space: pre-wrap; margin: 10px 0 0; line-height: 1.45; }
      .empty { color: #9aa9bd; text-align: center; margin-top: 60px; }
    </style>
  </head>
  <body>
    <main>
      <header><h1>Discord message stream</h1><span id="status" class="status">Connecting...</span></header>
      <section id="messages" aria-live="polite"><p class="empty">Waiting for messages...</p></section>
    </main>
    <script>
      const messageList = document.querySelector('#messages');
      const status = document.querySelector('#status');
      const seen = new Set();

      function addMessage(message) {
        if (seen.has(message.id)) return;
        seen.add(message.id);
        document.querySelector('.empty')?.remove();
        const article = document.createElement('article');
        const time = new Date(message.createdAt).toLocaleString();
        article.innerHTML = `<strong></strong><time></time><p></p>`;
        article.querySelector('strong').textContent = message.author;
        article.querySelector('time').textContent = time;
        article.querySelector('p').textContent = message.content;
        messageList.prepend(article);
      }

      fetch('/api/messages').then(response => {
        if (response.status === 401) { window.location.href = '/login.html'; return null; }
        return response.json();
      }).then(result => result?.messages.forEach(addMessage));
      const stream = new EventSource('/events');
      stream.addEventListener('ready', () => { status.textContent = 'Connected'; });
      stream.addEventListener('message', event => addMessage(JSON.parse(event.data)));
      stream.onerror = () => {
        status.textContent = 'Reconnecting...';
        if (stream.readyState === EventSource.CLOSED) window.location.href = '/login.html';
      };
    </script>
  </body>
</html>
